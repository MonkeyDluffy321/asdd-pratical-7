name:  ASDD CI Docker
on:
   push:
     branches: [main] 
workflow_dispatch:

 jobs:
   build:
     runs-on: ubuntu-latest

     steps:
       - name: Checkout Code
         uses:  actions/checkout@v4

       - name: setup python 
         uses:  actions/setup-python@v5
         with: 
            python-version: '3.12'

       - name: Install Dependencies
         run:  pip install -r requirements.txt   
       -  name: Run Tests 
          run:  python -m pytest -v

       - name: Build Docker Image
         run:  docker build -t attendence-demo . 
       - name: Run Docker Container
          run: |
           docker run --name attendance-demo attendance-demo
           docker ps --a
            docker logs attendance-demo
            docker rm attendence-demo
  
